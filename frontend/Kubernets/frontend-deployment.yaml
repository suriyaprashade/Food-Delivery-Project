apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-app
  namespace: production
  labels:
    environment: production-app
    app: food-app
    developer: suriyaprashad

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      automountServiceAccountToken: false

      containers:
      - name: frontend-app

        image: suriyadevops/food-app-frontend:v1
        imagePullPolicy: IfNotPresent

        ports:
        - name: frontend
          containerPort: 8080

        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 102
          allowPrivilegeEscalation: false

          capabilities:
            drop:
              - ALL

          seccompProfile:
            type: RuntimeDefault

        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true

        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          failureThreshold: 30

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: nginx-config
        configMap:
          name: frontend-nginx-config

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: react-app
