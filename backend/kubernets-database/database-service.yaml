apiVersion: v1
kind: Service 
metadata:
  name: database-service
  namespace: production
  labels:
    environment: production-app
    app: food-app
    developer: suriyaprashad
spec:
  clusterIP: None
  selector:
    app: mongodb-app
  ports:
  - name: mongo
    port: 27017
    targetPort: 27017
    protocol: TCP
